global:
  scrape_interval: 15s
scrape_configs:
  - job_name: support-api        # python -m src.api  -> /metrics on :8000
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: support-harness    # python -m evaluation.harness ... --metrics-port 8001
    static_configs:
      - targets: ["host.docker.internal:8001"]
